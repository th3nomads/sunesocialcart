name: Install Sun E Social GA4 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Google Analytics tag to site pages
        shell: python
        run: |
          from pathlib import Path

          measurement_id = 'G-JB9M6HTVHT'
          tag = '''  <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-JB9M6HTVHT"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', 'G-JB9M6HTVHT');
            </script>
          '''

          for filename in ('index.html', 'packages.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if f'gtag/js?id={measurement_id}' not in text:
                  text = text.replace('<head>\n', '<head>\n' + tag, 1)
                  path.write_text(text, encoding='utf-8')
      - name: Commit GA4 installation
        run: |
          if git diff --quiet -- index.html packages.html; then
            echo "GA4 tag already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html packages.html
          git commit -m "Install Sun E Social GA4 tracking"
          git push origin main
