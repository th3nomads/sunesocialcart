name: Install Sun E Social GA4 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct Google Analytics tag on site pages
        shell: python
        run: |
          from pathlib import Path

          old_id = 'G-JB9M6HTVHT'
          measurement_id = 'G-RMCDJNTGP6'

          for filename in ('index.html', 'packages.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if old_id in text:
                  text = text.replace(old_id, measurement_id)
              elif f'gtag/js?id={measurement_id}' not in text:
                  tag = f'''  <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){{dataLayer.push(arguments);}}
              gtag('js', new Date());
              gtag('config', '{measurement_id}');
            </script>
          '''
                  text = text.replace('<head>\n', '<head>\n' + tag, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit GA4 correction
        run: |
          if git diff --quiet -- index.html packages.html; then
            echo "Correct GA4 tag already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html packages.html
          git commit -m "Correct Sun E Social GA4 tracking ID"
          git push origin main
